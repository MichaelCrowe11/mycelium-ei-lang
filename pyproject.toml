[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mycelium-ei-language"
dynamic = ["version"]
description = "A small interpreted language for cultivation models: environment parameters, adapt functions that fire when they change, and genetic, particle swarm and ant colony optimizers."
readme = "README.md"
license = "LicenseRef-Proprietary"
license-files = ["LICENSE"]
requires-python = ">=3.9"
dependencies = []
authors = [
    {name = "Michael Benjamin Crowe", email = "michael@crowelogic.com"},
]
keywords = [
    "interpreter",
    "scripting-language",
    "cultivation",
    "mycelium",
    "genetic-algorithm",
    "particle-swarm",
    "ant-colony",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Software Development :: Interpreters",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/MichaelCrowe11/mycelium-ei-lang"
Repository = "https://github.com/MichaelCrowe11/mycelium-ei-lang"
Issues = "https://github.com/MichaelCrowe11/mycelium-ei-lang/issues"
Changelog = "https://github.com/MichaelCrowe11/mycelium-ei-lang/blob/master/CHANGELOG.md"

[project.scripts]
myc = "mycelium_ei.cli:main"
mycelium = "mycelium_ei.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools]
packages = ["mycelium_ei", "mycelium_ei.bio"]

[tool.setuptools.dynamic]
version = {attr = "mycelium_ei.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"
